<h1>Rclone Drive Backup</h1>
<p>Rclone Drive Backup is a personal backup setup that copies files from the owner’s Mac to a designated folder in the owner’s Google Drive. It uses Google Drive access to find the destination folder, compare files, and upload new or changed backups.</p>
